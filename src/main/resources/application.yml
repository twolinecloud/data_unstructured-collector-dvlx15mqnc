spring:
  # ── 프로파일을 안 주면 local 이다 ──────────────────────────────────────
  #   IntelliJ 나 java -jar 로 프로파일 없이 띄우면 이 파일의 기본값(8080 · 전 구간 MOCK ·
  #   대기 300초 · 브로커 주소 K8s 서비스명)으로 떠서, 화면에서 손으로 바꿔 가며 시험하다
  #   브로커 출력 경로가 어긋나면 5분씩 기다린다. 실제로 반복해서 당했다(인수인계 5.1·5.4).
  #   로컬 기동은 항상 local(8085 · DIRECT_JDBC/REST · 짧은 타임아웃)로 떨어지게 한다.
  #   K8s 는 Dockerfile 이 -Dspring.profiles.active=${SPRING_PROFILE} 를 박아 넣으므로
  #   영향이 없다 — default 는 active 가 하나도 없을 때만 쓰인다.
  profiles:
    default: local
  application:
    name: unstructured-collector
    version: v1.0
    desc: 비정형 데이터(접견·전화 음성 · 수용자 사진) 수집 서비스
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    default-property-inclusion: non_null

  # DB 시간 표준 = KST. 로그 컬렉터와 같은 시계를 봐야 한 배치의 T1·T4 가 어긋나지 않는다.
  # (Main.main 에서 JVM 기본 타임존도 고정한다)
  #
  # ⚠ spring.datasource / spring.sql.init 은 쓰지 않는다. 보라미 DataSource 는 두 개(로컬 H2 · 개발계 DB)를
  #   BoramiDataSourceConfig 가 만들고 조회 모드로 라우팅한다(voice.source.local-h2 / direct-db).
  #   H2 Mock 스키마 적재도 그 설정이 H2 에만 한다 — sql.init 을 라우터에 걸면 DROP TABLE 이 실DB 로 갈 수 있다.
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

service-path: ${SERVICE_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── 로그 컬렉터 ────────────────────────────────────────────────────────────
#   R&R: 로그 테이블(T1~T11)의 단일 writer 는 로그 컬렉터다. 이 서비스는 T1·T2·T4 를 API 로 적재한다.
#   base-url 은 context-path(/logc)까지 포함해서 준다.
#   기본 false — 컬렉터 없이도 기동·시연이 되게 하는 방어적 기본값이다.
log-collector:
  enabled: ${LOG_COLLECTOR_ENABLED:false}
  # 비우면 환경 프리셋(DeployEnvPreset) — 로컬 http://localhost:8090/logc · K8s http://log-collector-a2z96kgyrm:8080/logc
  base-url: ${LOG_COLLECTOR_BASE_URL:}
  auth-token: ${LOG_COLLECTOR_TOKEN:}
  connect-timeout-sec: 5
  read-timeout-sec: 30

# ── 음성 수집 ──────────────────────────────────────────────────────────────
#   외부 의존 4종이 서로 다른 시점에 준비된다. 각각 독립 스위치로 두어 준비된 것부터 전환한다.
#   REAL 모드는 실패 시 Mock 으로 빠지지 않는다(Fail-fast) — Mock 결과가 실제인 양 섞이면
#   시연·검증이 통째로 무의미해지기 때문이다.
voice:
  source:
    # ⚠ 여기(프로파일 없이 뜰 때)만 MOCK 이다. 아래 schema 가 비어 있어 DIRECT_JDBC 로 두면
    #   테이블명이 수식 없이(TB_IMSC_PTPR_DT) 나가 PostgreSQL·Oracle 에서 곧바로 깨진다.
    #   실제로 쓰는 프로파일(local·dev)은 스키마가 채워져 있어 기본이 DIRECT_JDBC(개발계 DB)다.
    mode: ${VOICE_SOURCE_MODE:MOCK}          # MOCK | DIRECT_JDBC | ESB_HTTP2DB
    esb-base-url: ${VOICE_ESB_BASE_URL:}
    interface-id: ${VOICE_ESB_IF_ID:}        # 표준 A 명명규칙 IF_송신(3)_수신(3)_일련(3) — 미확정(Q2)

    # 보라미 테이블이 놓인 스키마. 비우면 수식 없이(H2 Mock), 채우면 '스키마.테이블' 로 조립한다.
    #   실제 borami-db 확인값(2026-09-12): imsc=im · rerd=re · smsm=sm(테이블 없음) · xvarm=(없음)
    #   회의 축어록 [00:17:26] "TVG의 RE면 RE점, IM이면 IM점" 이 이 구조다.
    schema:
      imsc: ${VOICE_SCHEMA_IMSC:}            # 특이수용자상세 + 사용자통화내역
      rerd: ${VOICE_SCHEMA_RERD:}            # 녹취파일내역
      smsm: ${VOICE_SCHEMA_SMSM:}            # 공통파일기본 (REAL 모드에서만 쓴다)
      xvarm: ${VOICE_SCHEMA_XVARM:}          # XVARM 콘텐츠 메타 (REAL 모드에서만 쓴다)
      irim: ${VOICE_SCHEMA_IRIM:}            # 수용자 이미지 내역 TB_IRIM_BSIF_DS (실제 ir)

    # ── 조회 대상 DB 두 개 — 드롭다운이 곧 어느 DB 에 붙는지 ─────────────────
    #   MOCK (로컬 H2)  → local-h2  : 인메모리 H2 Mock 보라미 (기동 시 스키마·필터 검증 행 + 시뮬레이션 10건)
    #   개발계 DB       → direct-db : 개발계 borami-db(PostgreSQL). 로컬은 포트포워딩(15433) 전제.
    #                                 기동 시 붙어 보지 않고 첫 사용 때 붙는다 — 없으면 [DB 연결 확인] 이 사유를 보여준다
    local-h2:
      url: jdbc:h2:mem:borami;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password: ""
      max-pool-size: ${BORAMI_H2_POOL_MAX:40}
      leak-detection-threshold-ms: ${BORAMI_DB_LEAK_DETECTION_MS:30000}
    direct-db:
      url: ${BORAMI_DB_URL:${DB_URL:jdbc:postgresql://localhost:15433/borami}}
      driver-class-name: ${BORAMI_DB_DRIVER:${DB_DRIVER:}}
      username: ${BORAMI_DB_USER:${DB_USER:${POSTGRES_USERNAME:borami}}}
      password: ${BORAMI_DB_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
      connect-timeout-ms: ${BORAMI_DB_CONNECT_TIMEOUT_MS:3000}
      # ── HikariCP (원천 풀 borami-direct · borami-h2) ─────────────────────────────
      #   최대 40 — STT 워커 30개 이상에서도 여유. 최소 유휴 0 이라 쓰지 않는 연결은 열지 않는다.
      #   배치 워커는 원천 DB 를 쓰지 않는다(대상 조회는 루프 전, 로그는 로그 컬렉터 API) → 정상이면 최고치 1~2.
      #   누수 감지 30초 — 빌려 간 연결이 30초 넘게 안 돌아오면 Hikari 가 빌린 자리 스택과 함께 WARN 을 남긴다.
      #   유휴 60초 — 시험이 끝나 늘었던 연결은 60초 쉬면 닫혀 0 으로 돌아간다(성능 탭 'Hikari 반납' 으로 확인).
      max-pool-size: ${BORAMI_DB_POOL_MAX:40}
      leak-detection-threshold-ms: ${BORAMI_DB_LEAK_DETECTION_MS:30000}
      idle-timeout-ms: ${BORAMI_DB_IDLE_TIMEOUT_MS:60000}

    # ── XVARM 연동 (개발계 DB 모드 전용) ─────────────────────────────────────
    #   MOCK_DEV(기본): 개발계 borami-db 에 없는 공통파일기본·XVARM 테이블을 우리가 xvarm-mock 스키마에
    #                   만들고(sql/xvarm_mock_tables_postgres.sql) 시뮬레이션 데이터를 시딩해 4단 조인이 돌게 한다
    #   REAL          : 위 schema.smsm / schema.xvarm 의 실 테이블을 직접 조인한다
    #   H2(로컬)는 어느 쪽이든 평평한 테이블을 쓴다. 시뮬레이터 라디오로 재시작 없이 바꿀 수 있다.
    xvarm-mode: ${VOICE_XVARM_MODE:MOCK_DEV}   # MOCK_DEV | REAL
    xvarm-mock:
      schema-smsm: ${VOICE_XVARM_MOCK_SCHEMA_SMSM:sm}
      schema-xvarm: ${VOICE_XVARM_MOCK_SCHEMA_XVARM:xvarm}

    # 플래그 컬럼의 값 도메인. 스펙 문서에 값 정의가 없어 설정으로 뺀다.
    #   ⚠ 실DB 에서 TELP_PTCR_PRSR_YN 은 'Y' 가 아니라 '0' 이었다(2026-09-12).
    #     하드코딩하면 에러 없이 0건만 나와 알아채기 어렵다.
    flag:
      recorded-yes: ${VOICE_FLAG_RECORDED_YES:Y}    # TELP_PCALL_RECRD_YN 의 '녹음됨'
      ptcr-yes: ${VOICE_FLAG_PTCR_YES:Y}            # TELP_PTCR_PRSR_YN 의 '특이수용자'
      not-deleted: ${VOICE_FLAG_NOT_DELETED:N}      # DEL_YN 계열의 '삭제 안 됨'
      encrypted: ${VOICE_FLAG_ENCRYPTED:Y}          # CMMN_FILE_ENC_YN 의 '암호화됨'

  broker:
    mode: ${VOICE_BROKER_MODE:MOCK}          # MOCK | REST
    # 비우면 환경 프리셋(DeployEnvPreset) — 로컬 http://localhost:8082 · K8s http://borami-xvarm-broker-1joiuorqhl:8080
    base-url: ${VOICE_BROKER_BASE_URL:}
    # 시뮬레이터의 원클릭 주소 프리셋. 환경마다 브로커가 사는 곳이 달라
    # 매번 손으로 치지 않게 둔다. 주소가 바뀌면 여기만 고치면 화면에 그대로 반영된다.
    presets:
      - label: "개발계 K8s"
        url: "http://borami-xvarm-broker-1joiuorqhl:8080"
      - label: "로컬 PC"
        url: "http://localhost:8082"
    poll-interval-ms: 2000
    poll-timeout-sec: 120

  # ── 전화 파일 연계 ──────────────────────────────────────────────────────
  #   ⚠ 브로커(XVARM)와 <b>별개 스위치</b>다. 전화는 XVARM 을 타지 않는다 —
  #     보라미가 아닌 별도 서버에 파일이 있고 ESB 가 전화 전용 프로바이더를 구성해 준다.
  #   MOCK : 내부에서 더미 전화 음성을 수신 폴더에 만든다(외부 의존 없음)
  #   ESB  : 연계 프로바이더가 떨궈 주기를 기다린다. 로컬·개발계에는 ESB 가 없어 타임아웃 난다
  phone:
    mode: ${VOICE_PHONE_MODE:MOCK}          # MOCK | ESB
  sync:
    stable-check-ms: 1500
    wait-timeout-sec: ${VOICE_WAIT_TIMEOUT_SEC:300}
    naming-policy: ${VOICE_NAMING_POLICY:ORIGINAL}   # ORIGINAL | ESB_DAT (Q7)

  # ── 디렉터리 5종 — ROOT_DIR 아래 표준 배치 ────────────────────────────────
  #   base-dir(ROOT_DIR) 을 비우면 OS 로 정한다: Windows C:/k8s/unstructured_collector · Linux/K8s /k8s/unstructured_collector
  #   각 항목을 비우면 ROOT_DIR 로 파생되고, 채우면(환경변수) 그 값이 이긴다. 없는 폴더는 기동·생성·초기화 때 만든다.
  #     xvarm-original  {ROOT}/xvram/original_voice_files   XVARM 접견 원본 (시뮬레이션 더미 파일)
  #     receive-meet    {ROOT}/esb/meet                     ESB 원본 수신 (접견) — 로컬 브로커 BROKER_OUTPUT_DIR 과 같아야 한다
  #     receive-phone   {ROOT}/esb/phone                    ESB 원본 수신 (전화)
  #     work            {ROOT}/xvram/decoding               XVARM 접견 복호화 (작업 · 멱등 표식)
  #   최종 결과 폴더(xenon)는 없다 — STT 결과는 제논(Zenon)으로 보내고 PV 에 남기지 않는다(2026-10-01).
  dirs:
    base-dir: ${VOICE_BASE_DIR:}
    xvarm-original: ${VOICE_XVARM_ORIGINAL_DIR:}
    receive-meet: ${VOICE_MEET_DIR:}
    receive-phone: ${VOICE_PHONE_DIR:}
    work: ${VOICE_WORK_DIR:}

  # ── 시뮬레이션 데이터 — DB 메타(접견 5·전화 5) + 더미 파일 ─────────────────
  #   기동 시 자동 생성은 로컬(H2)만 켠다. 개발계는 시뮬레이터 [시뮬레이션 데이터 생성] 으로만 만든다.
  sim:
    seed-on-startup: ${VOICE_SIM_SEED_ON_STARTUP:false}

  decrypt:
    mode: ${VOICE_DECRYPT_MODE:SKIP}         # SKIP | REAL — 전화 복호화 주체 미확정(Q13)
    rvs-key-path: ${VOICE_RVS_KEY_PATH:}     # 접견 복호화 키(rvs_key.txt) — 미수령(Q8)

  stt:
    mode: ${VOICE_STT_MODE:MOCK}             # MOCK | NPU
    base-url: ${VOICE_STT_BASE_URL:}
    timeout-sec: ${VOICE_STT_TIMEOUT_SEC:300}
    mock-latency-ms: ${VOICE_STT_MOCK_LATENCY_MS:0}   # MOCK 가상 지연(NPU 응답 흉내) — 성능 테스트가 회차마다 덮어쓴다

  batch:
    # 자동 실행 최종 스위치. 실행 시각은 관리 화면(admin-api) UNSTRUCTURED 설정이 정한다 — 아래 unstructured.* 참고.
    #   (고정 cron VOICE_DAILY_CRON · VOICE_PERIODIC_CRON 은 2026-10-02 없앴다)
    schedule-enabled: ${VOICE_SCHEDULE_ENABLED:false}
    periodic-lag-min: 20
    specl-mng-se-cd: ${VOICE_SPECL_CODES:0,1,2,3,5}
    max-files-per-run: ${VOICE_MAX_FILES:500}
    job-id: ${VOICE_JOB_ID:VOICE_ANALYSIS}   # 컬렉터 JobId enum — VOICE_ANALYSIS → 작업코드 VOC
    data-type-cd: UNSTRUCTURED               # 컬렉터 C01 4종 중 비정형(음성). VOICE 는 C01 에 없는 코드였다
    retain-source-file: ${VOICE_RETAIN_SOURCE:false}
    # 워커 — 확보(I/O)와 STT(연산)를 나눈다. 둘 다 1 이면 순차(운영 기본), 아니면 생산자-소비자.
    #   acquire-workers: XVARM 확보 워커 — 브로커 추출 → 수신 폴더 도착(전화는 파일 연계). 원천 부하를 위해 1 권장
    #   concurrency    : STT 처리 워커 — 복호화 · STT · 제논 전송. 성능 테스트 결과를 보고 정한다
    acquire-workers: ${VOICE_BATCH_ACQUIRE_WORKERS:1}
    concurrency: ${VOICE_BATCH_CONCURRENCY:1}

  inmate-pid:
    # ⚠ 이름이 옛 서비스명이지만 바꾸지 않는다 — salt 가 바뀌면 같은 수용자의 PID 가 달라져
    #   이미 적재된 T4·T5 이력과 이어지지 않는다(unstructured-collector 이관 2026-09-29).
    salt: ${VOICE_PID_SALT:kcais-voice-collector}
    prefix: VP

logging:
  level:
    egovframework.unstructured.collector: ${LOG_LEVEL:INFO}

# ── 비정형 단일 진입점(UNSTRUCTURED) — admin 연동(스케줄 · 바로 실행 · 긴급 재처리) ──────────────
#   관리 화면(admin-api)의 UNSTRUCTURED 한 행이 음성(·이미지)을 움직인다. data-collector 와 같은 방식(2026-10-02 회의).
#   admin:    설정 조회 GET {base-url}/api/batch-schedules/UNSTRUCTURED — 기동 시 + refresh-ms 마다. 비우면 조회 끔
#   batch:    include-image — 음성 뒤에 이미지 수집도(순차). exec-id-wait-ms — 바로 실행·재처리 접수 응답에 실제 execId 를 싣기 위해 기다리는 상한
#   수집기가 받는 쪽: POST /internal/schedule/refresh · /internal/batch/run · /internal/batch/reprocess · GET /internal/batch/status
unstructured:
  admin:
    base-url: ${ADMIN_API_BASE_URL:}
    connect-timeout: ${ADMIN_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${ADMIN_API_READ_TIMEOUT:3s}
  schedule:
    refresh-ms: ${UNSTRUCTURED_SCHEDULE_REFRESH_MS:300000}
    zone: Asia/Seoul
  batch:
    include-image: ${UNSTRUCTURED_INCLUDE_IMAGE:false}
    exec-id-wait-ms: ${UNSTRUCTURED_EXEC_ID_WAIT_MS:1500}
  # ── 더미 데이터(시뮬레이터 SIM / 대시보드 DMY) — 생성 API · 스케줄러는 dev/local 프로필에서만 빈이 생긴다 ──
  #   dashboard.enabled: 대시보드 더미(DMY — 실존하지 않는 가상 교정번호) 생성 허용. dev/local 프로필이 켠다 · prod 는 강제 false
  #   daily: 매일 cron 에 어제 날짜로 DMY 를 추가(append)하고 retain-days 지난 DMY 를 지운다(catch-up 없음). 기본 끔
  mock:
    dashboard:
      enabled: ${UNSTRUCTURED_MOCK_DASHBOARD_ENABLED:false}
    daily:
      enabled: ${UNSTRUCTURED_MOCK_DAILY_ENABLED:false}
      cron: ${UNSTRUCTURED_MOCK_DAILY_CRON:0 30 1 * * *}
      types: ${UNSTRUCTURED_MOCK_DAILY_TYPES:PHONE,MEET}
      count: ${UNSTRUCTURED_MOCK_DAILY_COUNT:5}
      collect-fail: ${UNSTRUCTURED_MOCK_DAILY_COLLECT_FAIL:0}
      analyze-fail: ${UNSTRUCTURED_MOCK_DAILY_ANALYZE_FAIL:0}
      send-fail: ${UNSTRUCTURED_MOCK_DAILY_SEND_FAIL:0}
      retain-days: ${UNSTRUCTURED_MOCK_DAILY_RETAIN_DAYS:7}

# ── 제논(Zenon) 전송 — 파이프라인 3단계 SEND ────────────────────────────────
#   [수집] COLLECT → [정제/분석] ANALYZE(STT) → [적재/전송] SEND(제논). 클라우드 전송·비식별화(에이전트 커넥터)는
#   2026-10-01 제외됐다. STT 결과(전사 JSON)를 제논 수신 API 로 보내고, 성공하면 그 건의 임시 파일을 지운다(Purge).
#     MOCK — 수집기 안에서 수신증만 만든다(네트워크 없음). 제논 수신 사양 확정 전 개발계 기본
#     REST — POST {base-url}{receive-path} · multipart/form-data(file + metadata JSON)
#            로컬 시험: tools/zenon-mock(FastAPI) 를 띄우고 ZENON_MODE=REST ZENON_BASE_URL=http://localhost:8000
zenon:
  mode: ${ZENON_MODE:MOCK}
  base-url: ${ZENON_BASE_URL:}
  receive-path: ${ZENON_RECEIVE_PATH:/api/v1/zenon/receive}
  connect-timeout-ms: ${ZENON_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${ZENON_READ_TIMEOUT_MS:30000}
  keep-receipts: ${ZENON_KEEP_RECEIPTS:500}

# ══════════════════════════════════════════════════════════════════════════
#  수용자 이미지 수집 (image.*)
#    보라미 TB_IRIM_BSIF_DS(사진, IMAGE_SE_CD='1' 중 수용자별 최신) → TB_SMSM_CMFI_BS(DOC_ID)
#    → ASYSCONTENTELEMENT(FILEKEY) → 브로커 수신 → 복호화(접견과 같은 RVS 키) → 저장 → Admin DB 매핑
#    원천 DB · 브로커 · 복호화 모드 · 수신 폴더는 음성(voice.*)과 같은 것을 쓴다.
# ══════════════════════════════════════════════════════════════════════════
image:
  image-se-cd: ${IMAGE_SE_CD:1}
  output-dir: ${IMAGE_OUTPUT_DIR:}          # 사진 저장소. 비우면 {ROOT_DIR}/image
  workers: ${IMAGE_WORKERS:4}
  page-size: 500
  max-per-run: ${IMAGE_MAX_PER_RUN:2000}
  update-photo-ref: ${IMAGE_UPDATE_PHOTO_REF:false}   # 매핑과 함께 TB_SRC_INMATE_BS.PHOTO_REF 도 갱신(기본 끔 — 정형 수집기와 순서 꼬임)
  # Admin DB — 매핑 테이블 kcais.TB_SRC_INMATE_PHOTO. 기본은 로컬 H2(테이블 자동 생성).
  #   개발계·운영 PostgreSQL 은 DDL(db/admin/V1__tb_src_inmate_photo.sql)을 관리자가 먼저 적용한다.
  #   풀은 스프링 빈이 아니다(보라미 DataSource 자동 구성과 섞이지 않게) — AdminDb 참고.
  admin-db:
    url: ${ADMIN_DB_URL:jdbc:h2:mem:admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${ADMIN_DB_USERNAME:sa}
    password: ${ADMIN_DB_PASSWORD:}
    schema: ${ADMIN_DB_SCHEMA:kcais}
    max-pool-size: ${ADMIN_DB_POOL_MAX:10}
    connect-timeout-ms: ${ADMIN_DB_CONNECT_TIMEOUT_MS:3000}
    leak-detection-threshold-ms: ${ADMIN_DB_LEAK_DETECTION_MS:30000}
